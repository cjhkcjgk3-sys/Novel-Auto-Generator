name: AI 署名检查

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    trailer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: 检查新提交的 AI-Model 署名行
              shell: bash
              env:
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
                  AFTER: ${{ github.sha }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT" = "pull_request" ]; then
                    commits=$(git rev-list --no-merges "$PR_BASE..$PR_HEAD")
                  elif [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                    commits=$(git rev-list --no-merges -1 "$AFTER")
                  else
                    commits=$(git rev-list --no-merges "$BEFORE..$AFTER")
                  fi
                  fail=0
                  for c in $commits; do
                    if ! git log -1 --format=%B "$c" | grep -Eq '^AI-Model:[[:space:]]*[^[:space:]]+'; then
                      echo "::error::缺少署名行 AI-Model: —— $(git log -1 --format='%h %s' "$c")"
                      fail=1
                    fi
                  done
                  if [ "$fail" -ne 0 ]; then
                    echo "提交说明最后一行要写 AI-Model: 家族名（如 AI-Model: Grok，用户自己改的写 human）。规则见 https://github.com/cjhkcjgk3-sys/ai-dev-lessons"
                    exit 1
                  fi
                  echo "新提交都有署名。"
